[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-ohif-viewer"
version = "0.1.0"
description = "OHIF Viewer and Cornerstone3D DICOM viewing components for Reflex"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
maintainers = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
    "reflex",
    "reflex-custom-components",
    "ohif",
    "dicom",
    "dicomweb",
    "cornerstone3d",
    "medical-imaging",
    "pacs",
    "radiology",
]

dependencies = ["reflex>=0.9.0", "httpx>=0.25"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-ohif-viewer"
Source = "https://github.com/ecrespo/reflex-ohif-viewer"
Issues = "https://github.com/ecrespo/reflex-ohif-viewer/issues"
Changelog = "https://github.com/ecrespo/reflex-ohif-viewer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_ohif_viewer = ["*.js", "*.jsx", "*.pyi", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Type stubs are generated by `reflex component build` and marked DO NOT EDIT.
extend-exclude = ["*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "N", "SIM", "RUF"]
ignore = [
    "D203",
    "D213",
    # Property and computed-var docstrings describe a value, so a noun phrase
    # reads better than a forced imperative.
    "D401",
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names, and a test body is allowed to
# be longer than the line limit when it is holding sample data.
"tests/*" = ["D", "E501"]
# `lib_dependencies` must be a plain list: Reflex reads it off the class.
"custom_components/reflex_ohif_viewer/dicom_viewer.py" = ["RUF012"]
"custom_components/reflex_ohif_viewer/constants.py" = ["RUF012"]
# The same applies to Reflex state vars, which are class attributes by design.
"ohif_viewer_demo/*" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["reflex_ohif_viewer"]
branch = true

[tool.coverage.report]
# The component classes are mostly declarative prop definitions; the logic that
# needs covering is the URL builder, the config builders, the DICOMweb parsing
# and the Vite patch.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.bandit]
# The demo app and the tests are not shipped; scanning them only produces noise
# about assert statements and hard-coded demo URLs.
exclude_dirs = [".venv", ".web", "tests", "ohif_viewer_demo", "build", "dist"]
