version: 2

updates:
  # The workflows pin actions by major tag, which still leaves the pinned major
  # behind when a new one lands; this is what notices.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]
    target-branch: develop
    # One pull request for the lot. Ungrouped, a week in which five actions
    # move opens five pull requests that all touch the same two files and all
    # have to run the same checks.
    groups:
      github-actions:
        patterns: ["*"]

  # The runtime dependencies are deliberately loose (`reflex>=0.9`, `httpx>=0.25`)
  # because this is a library, so these pull requests are about the dev extra
  # and about being told when a floor needs raising.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    labels: ["dependencies", "python"]
    target-branch: develop
    groups:
      python-dev:
        patterns: ["*"]
        # A runtime floor is a deliberate compatibility statement, so those
        # stay separate pull requests worth reading one at a time.
        dependency-type: development
