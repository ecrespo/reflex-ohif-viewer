# Code quality: lint, formatting, generated-stub freshness, the test suite on
# every supported interpreter, and the artifacts PyPI would receive.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A new push to a branch makes the run in flight for that branch pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check --diff .

  stubs:
    name: Generated stubs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The .pyi files are what gives editors autocomplete on component props.
      # They are generated, so a prop added without regenerating them ships
      # stale autocomplete. Regenerate and fail if anything moved.
      - name: Regenerate the component stubs
        run: |
          python -c "
          from reflex.utils.pyi_generator import PyiGenerator
          PyiGenerator().scan_all(['custom_components/reflex_ohif_viewer'])
          "

      - name: Fail if the committed stubs are out of date
        run: |
          if ! git diff --quiet -- '*.pyi'; then
            echo "::error::The committed .pyi stubs do not match the component source."
            echo "Regenerate them and commit the result — see CONTRIBUTING.md."
            git diff -- '*.pyi'
            exit 1
          fi

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # tests/test_url_builder_parity.py runs the JavaScript URL builder under
      # Node and compares it against the Python one. Without Node it skips
      # itself, which would quietly stop checking that the two agree.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  package:
    name: Build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build the sdist and wheel
        run: python -m build

      - name: twine check
        run: twine check --strict dist/*

      # A wheel that builds is not the same as a wheel that imports: the
      # frontend .js/.jsx files are package data and are easy to leave out.
      - name: Install the wheel into a clean environment and import it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import pathlib

          import reflex_ohif_viewer as pkg

          print("version:", pkg.__version__)
          root = pathlib.Path(pkg.__file__).parent
          shipped = {path.name for path in root.iterdir()}
          required = {
              "RxDicomViewer.jsx",
              "RxOhifViewer.jsx",
              "rxCornerstoneRuntime.js",
              "rxOhifUrl.js",
              "py.typed",
              "dicom_viewer.pyi",
              "ohif_viewer.pyi",
          }
          missing = required - shipped
          assert not missing, f"the wheel is missing package data: {sorted(missing)}"

          # The URL builder is the one piece of logic with no frontend at all,
          # so it is the cheapest end-to-end check that the install works.
          url = pkg.build_ohif_url("http://localhost:3001", study_instance_uids=["1.2.3"])
          assert url == "http://localhost:3001/viewer?StudyInstanceUIDs=1.2.3", url
          print("smoke test passed")
          PY

      - name: Upload the distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
